# Үйлдвэрийн компьютер, бүгд нэг дор: ai-service + MediaMTX + cloudflared named tunnel + edge-announcer.
#   docker compose -f infra/edge/factory.yml up -d --build
# Тохиргоо: infra/edge/.env (BACKEND_URL, INTERNAL_API_KEY, EDGE_HOSTS, MODEL_PATH (заавал биш), MEDIA_DOMAIN, CLOUDFLARE_TUNNEL_TOKEN) + ai-service/.env
# Домэйнгүй үед (демо): factory-quick.yml
#
# Browser -> https://<MEDIA_DOMAIN> (WHEP/WHIP, тогтмол хаяг) -> Cloudflare -> cloudflared -> mediamtx:8889
# Видео (ICE) нь tunnel-ээр биш шууд 8189/udp, 8189/tcp-ээр явна (өөр сүлжээнээс бол STUN/TURN — infra/README.md).

name: pinequest-edge

services:
  mediamtx:
    extends:
      file: factory.base.yml
      service: mediamtx
    depends_on:
      - mtx-auth

  mtx-auth:
    extends:
      file: factory.base.yml
      service: mtx-auth

  ai-service:
    extends:
      file: ai-service.base.yml
      service: ai-service
    environment:
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
    depends_on:
      - mediamtx

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    # Named tunnel: Cloudflare Zero Trust дээр үүсгэсэн tunnel, Public Hostname <MEDIA_DOMAIN> -> http://mediamtx:8889.
    # Token-ийг command-д биш env-ээр өгнө. Image-ийн entrypoint нь "cloudflared --no-autoupdate".
    command: tunnel --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?infra/edge/.env-д CLOUDFLARE_TUNNEL_TOKEN бөглөнө үү (домэйнгүй бол factory-quick.yml)}
    depends_on:
      - mediamtx
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  edge-announcer:
    extends:
      file: factory.base.yml
      service: edge-announcer
    environment:
      # cloudflared /ready = 200 (Cloudflare-тэй холбогдсон) үед л мэдэгдэнэ
      EDGE_PUBLIC_URL: https://${MEDIA_DOMAIN:?infra/edge/.env-д MEDIA_DOMAIN (tunnel-ийн Public Hostname) бөглөнө үү}
    depends_on:
      - cloudflared
