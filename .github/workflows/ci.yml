# Push бүрт бүх сервисийн тест. Deploy-ийг Railway (backend), Vercel (web)-ийн GitHub integration хийнэ:
# Railway "Wait for CI" энэ workflow давсны дараа deploy хийнэ, main-д зөвхөн бүх check давсан PR merge хийгдэнэ (README "CI/CD").
# Job-уудын нэр (backend, ai-service, training, web) = branch protection-ий required check-ийн нэр.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # .env байхгүй: JWT/Fernet тестэд run бүрт түр түлхүүр үүсгэнэ, DB-тэй тестүүд (RUN_DB_TESTS) өөрсдөө алгасна
      - name: Test-only keys
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "CAMERA_SECRET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - run: python -m pytest -q

  ai-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      # opencv-python: libGL, glib
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0t64
      # CPU-only PyTorch (Dockerfile-тай адил): CUDA build-ээс ~5 дахин бага
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          YOLO_AUTOINSTALL: "False"
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics

  training:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0t64
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          YOLO_AUTOINSTALL: "False"
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Vercel дээр унах build алдааг merge-ээс өмнө барина
      - run: npm run build
